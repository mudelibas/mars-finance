<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mars Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<style>
/* ─── TradingView Light–inspired — tutarlı açık tema ─── */
:root {
  --bg-deep:   #ffffff;
  --bg-mid:    #f0f3fa;
  --bg-elev:   #e8ecf5;
  --surface:   #ffffff;
  --surface-solid: #f0f3fa;
  --border:    #e0e3eb;
  --border2:   #d1d4dc;
  --border-soft: #e8ecf5;
  --text:      #131722;
  --text-dim:  #434651;
  --muted:     #787b86;
  --muted2:    #787b86;
  --silver:    #4a5568;
  --gold:      #9a7b2e;
  --green:     #26a69a;
  --red:       #ef5350;
  --yellow:    #f57c00;
  --blue:      #2962ff;
  --accent:    #2962ff;
  --green-bg:  rgba(38, 166, 154, 0.12);
  --green-border: rgba(38, 166, 154, 0.38);
  --red-bg:    rgba(239, 83, 80, 0.1);
  --red-border: rgba(239, 83, 80, 0.35);
  --nav-surface: rgba(19, 23, 34, 0.04);
  --nav-border:  #e0e3eb;
  --nav-active-bg: var(--green-bg);
  --nav-active-bd: var(--green-border);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 2px 4px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lift: 0 2px 12px rgba(0,0,0,0.08);
  --radius:    16px;
  --radius-sm: 12px;
  --space-1: 8px;
  --space-2: 12px;
  --space-3: 16px;
  --space-4: 20px;
  --space-5: 24px;
  --space-6: 32px;
  --space-section: 24px;
  --space-inner: 20px;
  --main-pad-t: 12px;
  --content-after-tabs: 20px;
  --title-to-body: 20px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fw-n: 400;
  --fw-m: 500;
  --fw-s: 600;
  --fw-b: 500;
  --text-track-wide: 0.06em;
  --c-on-s: #1f1f1f;
  --c-on-s-variant: #5f6368;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html { -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }

html, body, button, input, select, textarea, optgroup { font-family: var(--font); }
code, kbd, samp, pre, .log-card code, #open-signals-home code, #sinyal-tab-ledger code,
.ledger-tbl, .log-bos {
  font-family: var(--font);
  font-feature-settings: "tnum" 1, "lnum" 1;
}

body {
  background: #f5f6f8;
  color: var(--c-on-s);
  font-size: 14px;
  line-height: 1.4286;
  font-weight: var(--fw-n);
  min-height: 100vh;
  letter-spacing: 0.01em;
  position: relative;
  z-index: 1;
}
body > .site-header,
body > main,
body > footer {
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
  padding-left: var(--space-5);
  padding-right: var(--space-5);
}
body > .site-header {
  padding-top: var(--space-3);
  padding-bottom: var(--space-3);
}
body > main { padding-top: 0; padding-bottom: var(--space-6); }

.m-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--space-inner);
  margin-bottom: var(--space-section);
  box-shadow: var(--shadow-sm);
}
.m-card:hover { box-shadow: var(--shadow-lift); border-color: #d1d4dc; }

#tab-panel-ana .region-prices { margin: 0; padding: 0; }
#tab-panel-ana .price-hero { margin: 0 0 var(--space-5) 0; padding: 0; }
#tab-panel-ana .region-open-s { margin: 0 0 var(--space-3) 0; padding-top: var(--space-5); }
#tab-panel-ana .region-stats { margin: 0; padding-top: var(--space-5); }
#tab-panel-ana .price-hero,
#tab-panel-ana .region-open-s .open-sig-block,
#tab-panel-ana .kpi-card {
  background: transparent;
  border: none;
  border-radius: 0;
  box-shadow: none;
  padding: 0;
  margin-bottom: 0;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
#tab-panel-ana .kpi-card { margin: 0; }
#tab-panel-ana .price-hero::before,
#tab-panel-ana .price-hero::after { display: none; }

.log-card, .indicators, .skor, .sinyal-panel { margin-bottom: var(--space-section); }

.site-header {
  position: relative;
  z-index: 2;
  background: transparent;
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 40px;
  width: 100%;
  background: transparent;
}
.main-tabs {
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  align-items: center;
  gap: var(--space-1);
  width: 100%;
  margin: 0 0 var(--content-after-tabs) 0;
  padding: 12px 0 12px 0;
}
.main-tabs .tabs--main { margin: 0; }
.tabs { display: flex; flex-wrap: nowrap; align-items: center; justify-content: center; margin: 0; gap: var(--space-1); }
.tab {
  position: relative;
  background: var(--nav-surface);
  border: 1px solid var(--nav-border);
  color: var(--c-on-s-variant);
  font-size: 0;
  border-radius: 24px;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.tab:hover { color: var(--c-on-s); background: var(--bg-mid); border-color: #dadce0; }
.tab.has-open { border-color: #81c995; }
.tab.active {
  background: #e8f0fe;
  color: var(--blue);
  border-color: #d2e3fc;
  box-shadow: 0 1px 2px rgba(60, 64, 67, 0.08);
}
.tab .tab-ic { width: 22px; height: 22px; flex-shrink: 0; opacity: 0.9; }
.tab.active .tab-ic { opacity: 1; }
.tab--icononly {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 40px;
  min-height: 40px;
  padding: 0;
}
.tabs--main .tab .badge {
  position: absolute;
  top: 2px; right: 2px;
  min-width: 16px; padding: 0 4px;
  font-size: 9px; font-weight: 600; line-height: 16px; text-align: center;
  border-radius: 8px;
}
@media (max-width: 480px) {
  .main-tabs .tabs--main { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
  .main-tabs .tab { flex: 0 0 auto; }
}
.tab-scene > h1.tab-screen-title,
.tab-scene h1.tab-screen-title {
  font-size: 24px;
  font-weight: 700;
  line-height: 1.33;
  letter-spacing: 0;
  color: #202124;
  text-align: left;
  margin: 0 0 var(--title-to-body) 0;
  padding: 20px 0 0 0;
}
.region-open-s .open-sig-block,
.open-sig-block { margin-top: 0; text-align: left; }
.open-sig-block { margin-bottom: 0; }
.region-open-s { margin-bottom: 0; }
.open-sig-block__head {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.15px;
  text-transform: none;
  color: #202124;
  margin: 0 0 var(--space-3) 0;
  line-height: 1.43;
}
.open-sig-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-soft);
  font-size: 12px;
  line-height: 1.5;
  color: var(--text-dim);
}
.open-sig-row:first-of-type { padding-top: 0; }
.open-sig-row:last-of-type { border-bottom: none; }
.open-sig-row .os-line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
.open-sig-row .os-tarih { font-size: 10px; color: var(--muted); }
.btn-link-txt {
  margin-top: 10px;
  width: 100%;
  padding: 8px 12px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.2s, border-color 0.2s;
}
.btn-link-txt:hover { background: var(--bg-mid); border-color: var(--border2); }
.veto-inline { margin-top: 8px; font-size: 10px; color: var(--muted); }
.ledger-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.ledger-tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  min-width: 280px;
}
.ledger-tbl th {
  text-align: left;
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 8px 6px 10px 0;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.ledger-tbl td {
  padding: 10px 8px 10px 0;
  border-bottom: 1px solid var(--border-soft);
  color: var(--text-dim);
  vertical-align: top;
  font-feature-settings: "tnum" 1;
}
.ledger-tbl td.ledger-dur {
  color: var(--text);
  max-width: 9em;
}
.ledger-tbl td.ledger-dur--risk {
  color: var(--red);
  font-weight: 600;
}
.ledger-tbl td.ledger-dur--ok {
  color: var(--green);
  font-weight: 600;
}
.tradingview-host { min-height: 300px; width: 100%; }
.tabs .badge {
  background: var(--red);
  color: #ffffff;
  font-size: 9px;
  font-weight: 600;
  padding: 2px 5px;
  border-radius: 6px;
  margin-left: 4px;
  vertical-align: middle;
  line-height: 1.2;
}
#app-scene-root {
  width: 100%;
  position: relative;
  min-height: 50vh;
  isolation: isolate;
}
#app-scene-root > [data-panel][hidden] {
  display: none !important;
  visibility: hidden !important;
  pointer-events: none !important;
}
#app-scene-root > [data-panel]:not([hidden]) {
  display: block !important;
  visibility: visible;
  position: relative;
  width: 100%;
  min-height: 0;
  pointer-events: auto;
}
#app-scene-root .log-card:last-child { margin-bottom: 0; }
#app-scene-root > [data-panel] .log-card { margin-bottom: var(--space-section); }
#app-scene-root > [data-panel] .log-card:last-child { margin-bottom: 0; }
.tab-panels, .app-scene-root { margin-top: 0; width: 100%; }

.logo {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #202124;
  font-feature-settings: "tnum" 1;
  line-height: 1.33;
}
.logo em, .logo .logo-ext { font-style: normal; }
.logo em {
  color: #202124;
  font-weight: 500;
  letter-spacing: 0.03em;
}
.logo .logo-ext { color: #b06000; font-weight: 500; letter-spacing: 0.03em; }

.header-time .live {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  font-size: 14px;
  font-weight: 500;
  color: #5f6368;
  letter-spacing: 0.2px;
}
.header-time time { font-variant-numeric: tabular-nums; }

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 3px rgba(38, 166, 154, 0.22);
  animation: pulse 2.5s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

.section-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: var(--text-track-wide);
  text-transform: uppercase;
  color: var(--muted);
  text-align: left;
  margin-bottom: 16px;
  font-weight: 600;
}
.section-title--center { text-align: center; }
.perf-header { margin-bottom: 4px; }
.perf-header .section-title { margin-bottom: 0; }

#tab-panel-ana .price-hero { position: relative; overflow: visible; padding: 0; }
#tab-panel-ana .region-prices { padding-top: 0; }
#tab-panel-ana .price-metric { box-shadow: none; }
.price-hero { position: relative; }
.price-metric {
  text-align: center;
  padding: var(--space-4) var(--space-3) var(--space-3) var(--space-3);
  background: #ffffff;
  border: 1px solid #e8eaed;
  border-radius: var(--radius);
  position: relative;
  z-index: 1;
}
.price-metric__k {
  font-size: 12px;
  font-weight: var(--fw-m);
  letter-spacing: 0.02em;
  text-transform: none;
  color: var(--c-on-s-variant);
  margin-bottom: var(--space-2);
  line-height: 1.33;
}
.price-metric__v {
  font-size: 28px;
  font-weight: 800;
  line-height: 1.2;
  font-feature-settings: "tnum" 1, "lnum" 1;
  color: var(--c-on-s);
  letter-spacing: -0.02em;
}

#price-hero .price-hero__meta #gumus-usd-display,
#price-hero .price-hero__meta #gumus-makas {
  display: inline;
  font: inherit;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 500;
  margin: 0;
  letter-spacing: 0.02em;
  -webkit-text-fill-color: unset;
  color: var(--text-dim);
  background: none;
}
#price-hero .pill { word-break: break-word; }
.price-hero__meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-top: var(--space-5);
  position: relative;
  z-index: 1;
  align-items: stretch;
}
.price-hero__meta .pill {
  min-width: 0;
  flex: 1 1 calc(33.333% - 7px);
  display: flex;
  align-items: center;
  justify-content: center;
}
.price-hero__meta .pill--change { flex: 1 1 100%; }
@media (min-width: 600px) {
  .price-hero__meta .pill--change { flex: 1 1 calc(25% - 8px); }
  .price-hero__meta .pill { flex: 1 1 calc(25% - 8px) !important; }
}
.price-hero__row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); margin-bottom: 0; }
.pill {
  text-align: center;
  font-size: 13px;
  font-weight: 500;
  color: #5f6368;
  padding: var(--space-2) var(--space-2);
  background: #ffffff;
  border: 1px solid #e8eaed;
  border-radius: 8px;
  letter-spacing: 0.1px;
}
.pill span { font-size: 13px; font-weight: 500; }
.pill--change { border: none; background: transparent; border-radius: var(--radius); padding: 0; overflow: hidden; }
.pill--change .pc-change {
  border: none !important;
  border-radius: 0;
  margin: 0;
  width: 100%;
  box-sizing: border-box;
  min-height: 100%;
  font-size: 13px;
  font-weight: 500;
}
#change-wrap, .pill--change#change-wrap { margin: 0; width: auto; }
#gumus-change, #change-wrap .pc-change { min-height: 40px; }
.pc-change {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 500;
  padding: var(--space-2) var(--space-2);
  border-radius: 6px;
  letter-spacing: 0.1px;
  border: 1px solid transparent;
  width: 100%;
  box-sizing: border-box;
}
.pc-change.up { background: rgba(38, 166, 154, 0.12); color: #1a7a72; border-color: rgba(38, 166, 154, 0.35); }
.pc-change.down { background: rgba(239, 83, 80, 0.1); color: #c62828; border-color: rgba(239, 83, 80, 0.35); }
.pc-change.flat {
  background: var(--nav-surface);
  color: var(--muted2);
  border-color: var(--border);
}
.pill--change .pc-change.up,
.pill--change .pc-change.down,
.pill--change .pc-change.flat {
  border: none !important;
}
.mini-gauge { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border-soft); position: relative; z-index: 1; }
.mini-gauge .perf-inline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
}
.mini-gauge .perf-pct { font-size: 26px; }
.mini-gauge .gauge-labels {
  margin-top: 10px;
  margin-bottom: 0;
}
.mini-gauge .gauge-track {
  position: relative;
  height: 4px;
  background: #e0e3eb;
  border-radius: 999px;
  overflow: visible;
  box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.06);
}
.gauge-wrap { position: relative; margin: 0 0 4px; }
.gauge-track {
  height: 4px;
  background: #e0e3eb;
  border-radius: 999px;
  position: relative;
  overflow: visible;
  box-shadow: inset 0 1px 1px rgba(0,0,0,0.06);
}
.gauge-segments { position: absolute; inset: 0; display: flex; border-radius: 999px; overflow: hidden; opacity: 0.6; }
.seg-sat  { background: linear-gradient(90deg, rgba(239, 83, 80, 0.3), rgba(230, 190, 160, 0.15)); flex: 0 0 30%; }
.seg-notr { background: rgba(120, 128, 140, 0.2); flex: 0 0 40%; }
.seg-al   { background: linear-gradient(90deg, rgba(38, 166, 154, 0.2), rgba(38, 166, 154, 0.35)); flex: 1; }

.gauge-fill {
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  border-radius: 999px;
  transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 1;
  background: linear-gradient(
    90deg,
    #c85a5a 0%,
    #8a7a6a 35%,
    #1e8c82 100%
  );
  box-shadow: 0 0 8px rgba(30, 140, 130, 0.15);
}
.gauge-pointer {
  position: absolute;
  top: -3px;
  width: 3px;
  height: 10px;
  background: #131722;
  border-radius: 1.5px;
  transform: translateX(-50%);
  z-index: 2;
  transition: left 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 1px 4px rgba(19, 23, 34, 0.2);
}
.gauge-pointer::after {
  content: "";
  position: absolute;
  bottom: -2px;
  left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border: 3px solid transparent;
  border-top: 3px solid #131722;
  opacity: 0.85;
}
.gauge-pointer.pulse { animation: gaugePulse 0.5s ease-in-out; }
@keyframes gaugePulse {
  0%, 100% { background: #131722; box-shadow: 0 1px 4px rgba(19, 23, 34, 0.2); }
  50%      { background: #26a69a; box-shadow: 0 0 8px rgba(38, 166, 154, 0.4); }
}
.gauge-labels {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  font-weight: 600;
  color: var(--muted);
  margin-top: 14px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.gauge-labels span.g-label-sell { color: #b85c5a; }
.gauge-labels .g-label-mid { color: var(--muted); }
.gauge-labels span.g-label-buy { color: #1a7a72; }

.perf-status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 22px;
  padding-top: 4px;
}
.status-badge {
  font-size: 9px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 999px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  border: 1px solid;
}
.badge-guclu-al  { background: var(--green-bg); color: #1a7a72; border-color: var(--green-border); }
.badge-orta-al   { background: rgba(157, 132, 72, 0.12); color: #7a5c20; border-color: rgba(157, 132, 72, 0.3); }
.badge-riskli-al { background: var(--red-bg); color: #c62828; border-color: var(--red-border); }
.badge-sessiz    { background: var(--nav-surface); color: var(--muted2); border-color: var(--border); }
.badge-satis     { background: var(--red-bg); color: #c62828; border-color: var(--red-border); }
.perf-pct {
  font-size: 32px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.02em;
  font-feature-settings: "tnum" 1;
  line-height: 1.1;
}

.indicators { padding: 0; background: none; border: none; box-shadow: none; margin-bottom: var(--space-section); }
.indicators * { letter-spacing: 0 !important; }
.indicators .section-title,
.indicators h2.section-title {
  text-align: center;
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0;
  text-transform: none;
  color: var(--text-dim);
}
.ind-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.ind-item {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 16px 14px;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  transition: background 0.3s, border-color 0.3s;
}
.ind-key {
  font-size: 12px;
  font-weight: 500;
  line-height: 1.33;
  text-transform: none;
  color: #5f6368;
  margin-bottom: 8px;
  letter-spacing: 0.1px;
}
.ind-val {
  font-size: 16px;
  font-weight: 500;
  color: #202124;
  font-feature-settings: "tnum" 1, "lnum" 1;
  letter-spacing: 0.1px;
  line-height: 1.5;
  margin-bottom: 6px;
}
.ind-sub {
  font-size: 12px;
  line-height: 1.5;
  color: #5f6368;
  font-weight: 400;
  margin-top: auto;
  padding-top: 8px;
  border-top: 1px solid #e8eaed;
  letter-spacing: 0.1px;
}

.skor { padding: 24px; }
.skor-grid { display: flex; flex-direction: column; gap: 0; }
.m-empty { text-align: center; padding: 28px 20px; color: var(--muted); min-height: 100px; display: flex; align-items: center; justify-content: center; }
.skor-item {
  display: flex;
  align-items: flex-start;

.skor-ust {
  flex: 1;
  display: block;
  min-width: 0;
}
.log-card .sinyal-item,
.sinyal-panel .sinyal-item {
  padding: 16px 0;
  border-bottom: 1px solid var(--border-soft);
  line-height: 1.7;
  font-size: 13px;
  margin: 0 -4px;
  padding-left: 16px;
  padding-right: 16px;
  border-left: 2px solid transparent;
  border-radius: 0 12px 12px 0;
  background: linear-gradient(90deg, rgba(38, 166, 154, 0.04), transparent 60%);
}
.log-card .sinyal-item:last-child,
.sinyal-panel .sinyal-item:last-child { border-bottom: none; }
.sinyal-ust { margin-bottom: 6px; }
.sinyal-tip { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
.tip-al { color: #1a7a72; }
.tip-sat { color: #c62828; }
.sinyal-zaman { font-size: 10px; color: var(--muted); font-weight: 500; letter-spacing: 0.04em; }
.sinyal-detay { color: var(--text-dim); font-size: 13px; }
.sinyal-kar { font-size: 13px; }
.kar-pos { color: #1a7a72; } .kar-neg { color: #c62828; }

#tab-panel-ana .kpi-card__head { margin-bottom: var(--space-3); }
#tab-panel-ana .kpi-card__title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.15px;
  text-transform: none;
  color: var(--c-on-s);
  line-height: 1.5;
  margin: 0;
}
.region-stats { margin: 0; }
.kpi-card__head { margin-bottom: var(--space-3); }
#stats-panel { min-height: 4px; }
#stats-panel .kpi-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-2);
}
@media (min-width: 500px) {
  #stats-panel .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3); }
}
#stats-panel .kpi-tile {
  background: #f8f9fa;
  border: 1px solid #e8eaed;
  border-radius: 12px;
  padding: var(--space-3) var(--space-3) var(--space-3) var(--space-3);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: var(--space-2);
  box-shadow: none;
  min-height: 80px;
  box-sizing: border-box;
}
#stats-panel .kpi-tile__label {
  font-size: 12px;
  font-weight: 500;
  line-height: 1.33;
  letter-spacing: 0.15px;
  color: #5f6368;
  max-width: 100%;
}
#stats-panel .kpi-tile__val {
  font-size: 20px;
  font-weight: 400;
  line-height: 1.2;
  color: var(--c-on-s);
  font-feature-settings: "tnum" 1, "lnum" 1;
  margin: 0;
}
#stats-panel .kpi-tile__sub { display: none; }
#stats-panel .kpi-tile--wide { grid-column: 1 / -1; }
#stats-panel .kpi-tile--accent { border-color: #e8eaed; }
#tab-panel-grafik .tradingview-panel { margin: 0; padding: 0; border: 0; background: none; }

.sinyal-panel, .tradingview-panel, .piyasa-tab-inner { margin-bottom: var(--space-section); }

#app-scene-root h2.section-title { text-transform: none; }
.skor h2.section-title { text-transform: none; }

.log-bos { font-size: 12px; color: var(--muted); text-align: center; padding: 20px 16px; }
.log-card code,
#open-signals-home code,
#sinyal-tab-ledger code {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 10px;
  color: var(--muted2);
  background: var(--bg-elev);
  padding: 3px 7px;
  border-radius: 6px;
  font-weight: 500;
  border: 1px solid var(--border);
}

footer {
  text-align: center;
  padding: var(--space-5) 0 var(--space-6) 0;
  font-size: 12px;
  font-weight: 400;
  line-height: 1.5;
  color: #5f6368;
  letter-spacing: 0.2px;
  text-transform: none;
  border: none;
  margin: 0;
}
.spinner {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--text-dim);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.skor-puan { font-size: 11px; }
.bar-g, .bar-y, .bar-r { border-radius: 1px; }
</style>
</head>
<body>

  <main id="main-views" aria-label="Görünümler — tek ekran">

  <footer>GRAY MARS LLC - 2026</footer>

<script>
const API = '';
let openSigsExpand = false;
let lastOpenSigs = [];
function _esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function trDateGoster(iso) {
  if (!iso) return '—';
  const m = String(iso).match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[3] + '.' + m[2] + '.' + m[1];
  return _esc(String(iso).slice(0, 16));
}

function netHedefYuzde(g, h) {
  if (g == null || h == null) return '—';
  const gi = Number(g), he = Number(h);
  if (!(gi > 0) || !isFinite(he)) return '—';
  const br = 100 * (he - gi) / gi;
  return br.toFixed(2) + '%';
}

function selectTab(name) {
  document.querySelectorAll('.tab[data-panel]').forEach(function (t) {
    const on = t.getAttribute('data-panel') === name;
    t.classList.toggle('active', on);
    t.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.querySelectorAll('#app-scene-root > [data-panel]').forEach(function (p) {
    const on = p.getAttribute('data-panel') === name;
    p.hidden = !on;
    p.setAttribute('aria-hidden', on ? 'false' : 'true');
    try { p.inert = !on; } catch (e) {}
  });
}

function initHeaderTabs() {
  document.querySelectorAll('.tab[data-panel]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      selectTab(btn.getAttribute('data-panel'));
    });
  });
  const wrap = document.getElementById('open-signals-wrap');
  if (wrap) {
    wrap.addEventListener('click', function (e) {
      const t = e.target;
      if (t && t.id === 'open-sig-toggle') {
        openSigsExpand = !openSigsExpand;
        openSignalsHomeRender(lastOpenSigs, openSigsExpand);
      }
    });
  }
}
initHeaderTabs();
selectTab('ana');

function cc(v) { return v > 0 ? 'var(--green)' : v < 0 ? 'var(--red)' : 'var(--muted2)'; }
function cs(v) { if(v==null) return '--%'; return (v>0?'+':'') + v.toFixed(2) + '%'; }

function setIndBorder(el, degisimYuzde) {
  const item = el?.closest?.('.ind-item');
  if(!item) return;
  if(degisimYuzde > 0) item.style.borderColor = 'rgba(38, 166, 154, 0.45)';
  else if(degisimYuzde < 0) item.style.borderColor = 'rgba(239, 83, 80, 0.45)';
  else item.style.borderColor = 'var(--border)';
}

function setIndChangeText(el, degisimYuzde, aciklama) {
  if(!el) return;
  const renk = degisimYuzde > 0 ? 'var(--green)' : degisimYuzde < 0 ? 'var(--red)' : 'var(--muted2)';
  const pct = cs(degisimYuzde ?? 0);
  el.innerHTML = `<span style="color:${renk}">${pct}</span><span style="color:var(--muted2)"> · ${aciklama}</span>`;
  setIndBorder(el, degisimYuzde ?? 0);
}

function _gerisayimMetni(created, tahminiSureStr) {
  if (!created || !tahminiSureStr) return null;
  const sure = parseInt(tahminiSureStr, 10);
  if (!(sure > 0)) return null;
  const iso = String(created).replace(' ', 'T') + '+03:00';
  const bitis = new Date(new Date(iso).getTime() + sure * 3600 * 1000);
  const kalan = bitis - Date.now();
  if (kalan <= 0) return { metin: 'Riskli', asimdi: true };
  const toplamDk = Math.floor(kalan / 60000);
  const saat = Math.floor(toplamDk / 60);
  const dk = toplamDk % 60;
  const metin = saat > 0 ? `${saat}s ${dk}dk kaldı` : `${dk}dk kaldı`;
  return { metin, asimdi: false };
}

function openSignalsHomeRender(openList, expanded) {
  const el = document.getElementById('open-signals-home');
  if (!el) return;
  const L = (openList && openList.length) ? openList.slice() : [];
  if (!L.length) {
    el.innerHTML = '<div class="log-bos" style="padding:8px 0">Açık sinyal yok.</div>';
    return;
  }
  const toShow = expanded || L.length <= 5 ? L : L.slice(0, 5);
  const rows = toShow.map(s => {
    const g = s.giris_tl != null ? '₺' + Number(s.giris_tl).toFixed(2) : '—';
    const t = s.hedef_tl != null ? '₺' + Number(s.hedef_tl).toFixed(2) : '—';
    const nk = netHedefYuzde(s.giris_tl, s.hedef_tl);
    const st = s.created || '—';
    const gs = _gerisayimMetni(s.created, s.tahmini_sure_saat);
    const gsHtml = gs
      ? `<span style="font-size:10px;color:${gs.asimdi ? 'var(--red)' : 'var(--green)'}">⏱ ${gs.metin}</span>`
      : '';
    return `<div class="open-sig-row" data-sid="${_esc(s.id || '')}">
      <div class="os-line"><span><strong style="color:var(--text)">Giriş</strong> ${g} ${gsHtml}</span><span><strong style="color:var(--text)">Hedef</strong> ${t}</span></div>
      <div class="os-line"><span class="os-tarih">${_esc(st)}</span><span>Tahmini hedef kârı <strong style="color:var(--silver)">${nk}</strong></span></div>
    </div>`;
  }).join('');
  let more = '';
  if (L.length > 5) {
    more = '<button type="button" class="btn-link-txt" id="open-sig-toggle">' + (expanded ? 'Daha az göster' : 'Daha fazla göster') + '</button>';
  }
  el.innerHTML = rows + more;
}

function kpiFormatTile(label, value, extraClass) {
  return (
    '<div class="kpi-tile' + (extraClass ? ' ' + extraClass : '') + '">' +
    '<span class="kpi-tile__label">' + _esc(label) + '</span>' +
    '<span class="kpi-tile__val">' + _esc(String(value)) + '</span></div>'
  );
}

function statsPanelRender(st) {
  const el = document.getElementById('stats-panel');
  if (!el) return;
  if (!st || typeof st !== 'object') {
    el.innerHTML = '<p style="margin:0;font-size:14px;color:#5f6368">İstatistik yüklenemedi</p>';
    return;
  }
  const akt = st.aktif_sinyal ?? 0;
  const hedef = st.kazanan_kapanis ?? 0;
  const gecici = st.open_older_24h ?? 0;
  const basari = st.kazanma_orani_yuzde != null ? st.kazanma_orani_yuzde.toFixed(1) + ' %' : '—';
  let basariValStyle = 'font-weight:700';
  const ko = st.kazanma_orani_yuzde;
  if (ko != null) {
    if (ko < 50) basariValStyle += ';color:var(--red)';
    else basariValStyle += ';color:var(--green)';
  }
  const ortSure = st.ort_sure_saat != null ? st.ort_sure_saat + ' saat' : '—';
  const strictBasari = st.strict_success_rate_pct != null ? st.strict_success_rate_pct.toFixed(1) + ' %' : '—';
  let strictStyle = 'font-weight:700';
  if (st.strict_success_rate_pct != null) {
    strictStyle += st.strict_success_rate_pct < 50 ? ';color:var(--red)' : ';color:var(--green)';
  }
  el.innerHTML = (
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-2);margin-bottom:var(--space-2)">' +
    '<div class="kpi-tile" style="min-height:48px">' +
    '<span class="kpi-tile__label">Ort. hedefe ulaşma</span>' +
    '<span class="kpi-tile__val" style="font-size:16px">' + ortSure + '</span></div>' +
    '<div class="kpi-tile" style="min-height:48px">' +
    '<span class="kpi-tile__label">Süre içi başarı</span>' +
    '<div class="kpi-tile" style="min-height:48px">' +
    '<span class="kpi-tile__label">Ort. net kâr</span>' +
    '<span class="kpi-tile__val" style="font-size:16px;font-weight:700;color:var(--green)">%' + (st.ort_kar_pct != null ? st.ort_kar_pct.toFixed(2) : '—') + '</span></div>' +
    '</div>' +
    '<div class="kpi-grid">' +
    kpiFormatTile('Açık sinyal', String(akt), '') +
    kpiFormatTile('Hedefe ulaşan', String(hedef), '') +
    kpiFormatTile('Riskli sinyal', String(gecici), '') +
    '<div class="kpi-tile">' +
    '<span class="kpi-tile__label">' + _esc('Başarı oranı') + '</span>' +
    '<span class="kpi-tile__val" style="' + basariValStyle + '">' + _esc(basari) + '</span></div>' +
    '</div>'
  );
}

function ledgerSiralamaYeniOnce(ledger) {
  if (!ledger || !ledger.length) return [];
  return ledger.slice().sort((a, b) => {
    const ta = new Date((a.status === 'OPEN' ? a.created : (a.closed || a.created)) || 0).getTime();
    const tb = new Date((b.status === 'OPEN' ? b.created : (b.closed || b.created)) || 0).getTime();
    return tb - ta;
  });
}

function durumLedgerHucre(s) {
  const st = s.status;
  if (st === 'OPEN') {
    const sure = parseInt(s.tahmini_sure_saat || 28);
    const iso = String(s.created || '').replace(' ', 'T') + '+03:00';
    const gecenSaat = (Date.now() - new Date(iso).getTime()) / 3600000;
    if (gecenSaat > sure) return { cls: 'ledger-dur ledger-dur--risk', text: 'Riskli' };
    return { cls: 'ledger-dur', text: 'Açık' };
  }
  if (st === 'CLOSED') {
    const n = (s.close_reason || '').toString().toUpperCase();
    if (n === 'TP') {
      return {
        cls: 'ledger-dur ledger-dur--ok',
        text: 'Başarılı (' + trDateGoster(s.closed) + ')',
      };
    }
  }
  return { cls: 'ledger-dur', text: '—' };
}

function sinyalTabLedgerRender(ledger) {
  const el = document.getElementById('sinyal-tab-ledger');
  if (!el) return;
  const L0 = ledger && ledger.length ? ledger : [];
  const L = ledgerSiralamaYeniOnce(L0).slice(0, 110);
  if (!L.length) { el.innerHTML = '<div class="log-bos">Kayıt yok.</div>'; return; }
  const rows = L.map(s => {
    const g0 = s.giris_tl, h0 = s.hedef_tl;
    const e = (g0 != null) ? ('₺' + Number(g0).toFixed(2)) : (s.entry_target_usd != null ? '$' + s.entry_target_usd.toFixed(2) : '—');
    const t = (h0 != null) ? ('₺' + Number(h0).toFixed(2)) : (s.tp_usd != null ? '$' + s.tp_usd.toFixed(2) : '—');
    const tr = s.status === 'OPEN' ? (s.created || '—') : (s.closed || s.created || '—');
    const du = durumLedgerHucre(s);
    return '<tr><td style="font-size:11px;color:var(--muted)">' + _esc(tr) + '</td><td>' + e + '</td><td>' + t + '</td><td class="' + du.cls + '">' + _esc(du.text) + '</td></tr>';
  }).join('');
  el.innerHTML = '<table class="ledger-tbl" role="table" aria-label="Sinyal defteri"><thead><tr><th>Tarih</th><th>Giriş</th><th>Hedef</th><th>Durum</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function setIdText(id, value) {
  const el = document.getElementById(id);
  if (el) el.textContent = value;
}

async function veriYukle() {
  setIdText('son-guncelleme', '···');
  try {
    const r = await fetch(API+'/api/durum');
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();

    const ga=d.gumus_alis, gs=d.gumus_satis, gm=d.gumus_makas;
    const gd=d.gumus_degisim??0;

    setIdText('gumus-alis', ga!=null?ga.toFixed(2):'--');
    setIdText('gumus-satis', gs!=null?gs.toFixed(2):'--');
    {
      const mk = document.getElementById('gumus-makas');
      if (mk) mk.textContent = gm != null && gm !== '' && !isNaN(Number(gm)) ? '₺' + Number(gm).toFixed(2) : '—';
    }
    {
      const el = document.getElementById('gumus-usd-display');
      if (el) el.textContent = d.gumus_usd != null ? `$${d.gumus_usd.toFixed(2)}` : '$--';
    }
    const gcEl = document.getElementById('gumus-change');
    if (gcEl) {
      gcEl.textContent = 'Günlük değişim ' + cs(gd);
      gcEl.className = 'pc-change ' + (gd>0?'up':gd<0?'down':'flat');
    }

    const p = d.piyasa_gostergeler || {};
    const vix = p.vix ?? 0, dxy = p.dxy ?? 0, dxyD = p.dxy_degisim ?? 0;
    const altinEndeks = p.altin ?? 0, altinEndeksD = p.altin_degisim_yuzde ?? 0;
    const pet = p.petrol ?? 0, petD = p.petrol_degisim_yuzde ?? 0;

    setIdText('m-vix', vix.toFixed(1));
    const vyEl = document.getElementById('m-vix-yorum');
    if (vyEl) {
      if (vix>30) { vyEl.textContent='Panik düşüşü var, gümüş yükselebilir.'; vyEl.style.color='var(--yellow)'; }
      else if (vix>25) { vyEl.textContent='Belirsizlik var, gümüş yükselebilir.'; vyEl.style.color='var(--green)'; }
      else if (vix<15) { vyEl.textContent='Gümüşe ilgi azalıyor, düşüş gelebilir.'; vyEl.style.color='var(--red)'; }
      else { vyEl.textContent='Piyasa sakin. Teknik sinyaller güvenilir.'; vyEl.style.color='var(--muted2)'; }
    }

    setIdText('m-dxy', dxy.toFixed(2));
    const dEl = document.getElementById('m-dxy-change');
    setIndChangeText(
      dEl,
      dxyD,
      dxyD>0 ? 'Dolar güçleniyor, gümüş düşebilir.' : dxyD<0 ? 'Dolar zayıflıyor, gümüş yükselebilir.' : 'Nötr'
    );

    {
      const aValEl = document.getElementById('m-altin-endeks');
      if (aValEl) aValEl.textContent = altinEndeks ? `$${altinEndeks.toFixed(2)}` : '$--';
    }
    const aEl = document.getElementById('m-altin-endeks-change');
    setIndChangeText(
      aEl,
      altinEndeksD,
      altinEndeksD>0 ? 'Altın yükseliyor, gümüş de yükselebilir.' : altinEndeksD<0 ? 'Altın zayıflıyor, gümüş de düşebilir.' : 'Nötr'
    );

    setIdText('m-petrol', `$${pet.toFixed(1)}`);
    const pEl = document.getElementById('m-petrol-change');
    setIndChangeText(
      pEl,
      petD,
      petD<-1 ? 'Gümüşte artış olabilir.' : petD>1 ? 'Gümüşte düşüş olabilir.' : 'Nötr'
    );

    lastOpenSigs = d.open_signals && d.open_signals.length ? d.open_signals : [];
    openSignalsHomeRender(lastOpenSigs, openSigsExpand);
    statsPanelRender(d.stats);
    sinyalTabLedgerRender(d.signal_ledger);

    {
      const gu = d.guncelleme || '';
      if (gu.length >= 16) {
        setIdText('son-guncelleme', gu.slice(11, 16));
      } else {
        const now = new Date();
        setIdText('son-guncelleme', now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0'));
      }
    }
  } catch(e) {
    setIdText('son-guncelleme', 'HATA');
    console.error(e);
  }
}

window.onload=veriYukle;
setInterval(veriYukle,30000);
setInterval(function() {
  if (lastOpenSigs && lastOpenSigs.length) {
    openSignalsHomeRender(lastOpenSigs, openSigsExpand);
  }
}, 60000);
</script>
</body>
</html>
